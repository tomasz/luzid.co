# pnpm 12 blocks dependency install scripts unless listed here (strictDepBuilds).
# esbuild and workerd need theirs; fsevents ships a prebuilt binary, so it is denied.
allowBuilds:
  esbuild: true
  workerd: true
  fsevents: false

# Supply chain: install only releases at least a day old. Dependabot's cooldown (7 days)
# stays above this, so every version it proposes installs; security updates skip the
# cooldown, which is why this gate stays short.
minimumReleaseAge: 1440

# Vite+ ships its own Vite and Vitest; these make every dependency resolve the same copies.
# Bump them together with vite-plus (test/repo.test.js checks they stay exact).
overrides:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest: 5.0.1

# TEMPORARY: Vite+ 1.0 was released on 2026-09-28. Removed in this PR's last commit, once
# every version below is past the one-day gate; test/repo.test.js then forbids the key.
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
