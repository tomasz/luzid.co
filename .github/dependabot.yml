version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 14
    commit-message:
      prefix: deps
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: deps
    groups:
      actions:
        patterns: ["*"]

# No `devcontainers` entry: that ecosystem only updates Features, and this devcontainer
# has none. The image floats on the :24 major tag.
