name: cd

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    # Skipped until the owner finishes Sitting 2 and sets DEPLOY_ENABLED, so the first
    # pushes to main are green instead of failing on a missing Cloudflare token.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://luzid.co
    # Never cancel: a run killed between `deploy` and `smoke` would leave a bad version live.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true # vp version from package.json, Node from engines.node; runs vp install

      # `vp build` writes dist/ and .wrangler/deploy/config.json, which `wrangler deploy`
      # follows to dist/luzid_co/wrangler.json. Deploying without it ships nothing new.
      - run: pnpm exec vp build

      - name: deploy
        id: deploy
        run: pnpm exec wrangler deploy --message "$GITHUB_SHA"

      - name: smoke test
        id: smoke
        run: node scripts/smoke.mjs https://luzid.co

      # smoke.mjs writes rollback=true only for worker-level failures; zone-level ones (exit 2)
      # fail the job without touching the Worker. With no version id, `wrangler rollback`
      # picks the most recent earlier deployment at 100%, i.e. what was live before this run.
      - name: roll back
        if: failure() && steps.smoke.outputs.rollback == 'true'
        run: |
          pnpm exec wrangler rollback --yes --message "smoke failed $GITHUB_SHA"
          echo "::error::Smoke test failed at the Worker level; production was rolled back."
