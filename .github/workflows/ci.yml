name: ci

on:
  pull_request:
  workflow_call:
    inputs:
      fit-scope:
        description: "`changed` (the per-PR matrix) or `all` (every font and variant); docs/fit.md"
        type: string
        default: changed

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"
  # Read by e2e/fit-lib.js. A pull_request run has no inputs, so it is always `changed`.
  FIT_SCOPE: ${{ inputs.fit-scope || 'changed' }}

# Inside a called workflow `github.workflow` resolves to the CALLER's name, so a shared
# group expression would make cd.yml deadlock against its own ci job. The scope keeps a
# dispatched sweep from queueing a dispatched deploy behind it.
concurrency:
  group: ci-${{ github.event_name }}-${{ inputs.fit-scope || 'changed' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2 # keep in sync with devEngines.packageManager; test/repo.test.js enforces it
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json # engines.node, the one place the version is declared
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  e2e:
    runs-on: ubuntu-24.04
    # One job per engine, in parallel: the engines are independent, and one engine's
    # failure then names itself. The per-PR scope is the 8 seed fonts plus whatever the
    # branch changed, so it does not grow with the catalogue; FIT_SCOPE=all does, and
    # gets its own ceiling (sweep.yml): a full Chromium sweep took 20-30 min on CI (#57),
    # and Firefox has run about 2.4x Chromium on this kind of fit-heavy scope.
    timeout-minutes: ${{ inputs.fit-scope == 'all' && 120 || 25 }}
    strategy:
      fail-fast: false # one engine's failure must not hide another's
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # --changed scopes need the base branch
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2 # keep in sync with devEngines.packageManager; test/repo.test.js enforces it
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json # engines.node, the one place the version is declared
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only the engine this job runs; installing all three costs minutes per job.
      - run: pnpm exec playwright install --with-deps ${{ matrix.project }}
      - run: pnpm run build
      - run: pnpm exec playwright test --project=${{ matrix.project }}
      - name: render sheets
        if: ${{ matrix.project == 'chromium' && hashFiles('scripts/sheet.mjs') != '' }}
        run: pnpm run sheet -- --changed
        continue-on-error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-${{ matrix.project }}
          path: |
            sheets/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The single required check. It aggregates everything above, so a green `ci` is the
  # whole signal and the ruleset never needs updating when a job is added.
  ci:
    runs-on: ubuntu-24.04
    needs: [check, e2e]
    if: always()
    steps:
      - name: verify all jobs passed
        run: |
          echo "check=${{ needs.check.result }} e2e=${{ needs.e2e.result }}"
          [ "${{ needs.check.result }}" = "success" ] || exit 1
          [ "${{ needs.e2e.result }}" = "success" ] || exit 1
