name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

# Inside a called workflow `github.workflow` resolves to the CALLER's name, so a shared
# group expression would make deploy.yml deadlock against its own ci job.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2 # keep in sync with engines.pnpm; test/repo.test.js enforces it
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  e2e:
    runs-on: ubuntu-24.04
    # One job per engine, in parallel. The suite grew with the library -- 8 fonts and 53
    # variants when the fit scan was written, 147 and 692 now -- and a single job ran past
    # 30 minutes. Raising the ceiling again would only defer it; the engines are
    # independent, so splitting them keeps wall-clock roughly flat as the catalogue grows.
    timeout-minutes: 25
    strategy:
      fail-fast: false # one engine's failure must not hide another's
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # --changed scopes need the base branch
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2 # keep in sync with engines.pnpm; test/repo.test.js enforces it
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only the engine this job runs; installing all three costs minutes per job.
      - run: pnpm exec playwright install --with-deps ${{ matrix.project }}
      - run: pnpm run build
      - run: pnpm exec playwright test --project=${{ matrix.project }}
      - name: contact sheets
        if: ${{ matrix.project == 'chromium' && hashFiles('scripts/sheet.mjs') != '' }}
        run: pnpm run sheet -- --changed
        continue-on-error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sheets-${{ matrix.project }}
          path: |
            sheets/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The single required check. It aggregates everything above, so a green `ci` is the
  # whole signal and the ruleset never needs updating when a job is added.
  ci:
    runs-on: ubuntu-24.04
    needs: [check, e2e]
    if: always()
    steps:
      - name: verify every job succeeded
        run: |
          echo "check=${{ needs.check.result }} e2e=${{ needs.e2e.result }}"
          [ "${{ needs.check.result }}" = "success" ] || exit 1
          [ "${{ needs.e2e.result }}" = "success" ] || exit 1
