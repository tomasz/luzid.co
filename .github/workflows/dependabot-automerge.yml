name: dependabot-automerge

on: pull_request

permissions: {}

jobs:
  automerge:
    # Only Dependabot's own PRs on this repo; fork PRs can't impersonate this login.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'tomasz/luzid.co'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # Majors wait for a human. Everything else merges once the required checks pass.
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
